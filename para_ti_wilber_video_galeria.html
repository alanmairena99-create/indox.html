<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Ti, Wilber ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010207;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      user-select: none;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 34%, rgba(65, 130, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 76%, rgba(80, 150, 255, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, transparent 42%, rgba(0, 1, 5, 0.88) 100%);
      pointer-events: none;
      z-index: 4;
    }

    .center-dedication {
      position: absolute;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      width: 92%;
      max-width: 760px;
      animation: heartbeatText 2.5s ease-in-out infinite;
    }

    .subtitle-top {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.76rem, 1.85vw, 1.06rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(215, 238, 255, 0.94);
      text-shadow:
        0 0 12px rgba(120, 190, 255, 0.85),
        0 0 26px rgba(80, 145, 255, 0.55);
      margin-bottom: 2px;
    }

    .main-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.8rem, 10vw, 6.8rem);
      font-weight: 400;
      line-height: 1.02;
      background: linear-gradient(180deg, #ffffff 10%, #dceeff 52%, #7cc0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 0 14px rgba(145, 205, 255, 0.95))
        drop-shadow(0 0 36px rgba(85, 155, 255, 0.7))
        drop-shadow(0 0 55px rgba(255, 130, 180, 0.28));
    }

    .love-line {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.88rem, 2.1vw, 1.28rem);
      letter-spacing: 0.26em;
      color: #ffffff;
      margin-top: 4px;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.95),
        0 0 24px rgba(255, 115, 165, 0.85),
        0 0 38px rgba(110, 180, 255, 0.6);
    }

    @keyframes heartbeatText {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }
      14% {
        transform: translate(-50%, -50%) scale(1.045);
      }
      28% {
        transform: translate(-50%, -50%) scale(1);
      }
      42% {
        transform: translate(-50%, -50%) scale(1.028);
      }
      70% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .floating-item {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .floating-phrase {
      padding: 7px 18px;
      border-radius: 999px;
      background: rgba(14, 27, 56, 0.34);
      border: 1px solid rgba(175, 218, 255, 0.28);
      backdrop-filter: blur(5px);
      font-size: clamp(0.8rem, 1.85vw, 1.08rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: rgba(242, 250, 255, 0.97);
      text-shadow: 0 0 12px rgba(130, 198, 255, 0.85);
      box-shadow:
        0 0 22px rgba(65, 135, 255, 0.22),
        inset 0 0 12px rgba(255, 255, 255, 0.06);
    }

    .floating-spark {
      font-size: clamp(1.05rem, 2.5vw, 1.55rem);
      filter: drop-shadow(0 0 12px rgba(175, 222, 255, 0.95));
    }

    .controls-bar {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 15;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ui-btn, .video-pick-btn {
      background: rgba(16, 30, 62, 0.54);
      border: 1px solid rgba(175, 218, 255, 0.36);
      color: rgba(235, 246, 255, 0.97);
      backdrop-filter: blur(6px);
      padding: 8px 15px;
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 18px rgba(70, 140, 255, 0.22);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ui-btn:hover, .video-pick-btn:hover {
      background: rgba(30, 58, 115, 0.78);
      border-color: rgba(215, 238, 255, 0.72);
      transform: translateY(-1px);
    }

    #galleryVideoInput {
      display: none;
    }

    /* Elemento de video oculto que aporta el sonido del video elegido de la galería */
    #galleryVideoSource {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
      left: -20px;
      top: -20px;
    }

    .media-badge {
      position: fixed;
      top: 58px;
      right: 18px;
      z-index: 15;
      font-size: 0.72rem;
      color: rgba(210, 234, 255, 0.85);
      background: rgba(8, 16, 36, 0.62);
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(175, 218, 255, 0.22);
      backdrop-filter: blur(4px);
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(195, 225, 255, 0.5);
      z-index: 12;
      pointer-events: none;
      text-align: center;
      width: 90%;
    }
  </style>
</head>
<body>
  <canvas id="universeCanvas"></canvas>
  <div class="vignette"></div>

  <!-- Video oculto usado para reproducir el audio de un video de la galería -->
  <video id="galleryVideoSource" loop playsinline preload="auto"></video>

  <div class="controls-bar">
    <label class="video-pick-btn" for="galleryVideoInput">🎬 Elegir video de galería</label>
    <input type="file" id="galleryVideoInput" accept="video/*" />
    <button class="ui-btn" id="meteorShowerBtn" type="button">☄️ Lluvia de estrellas</button>
    <button class="ui-btn" id="musicBtn" type="button">♪ Música: OFF</button>
  </div>

  <div class="media-badge" id="mediaBadge">
    Video: ninguno elegido (usa "Elegir video de galería" o melodía integrada)
  </div>

  <div class="center-dedication">
    <div class="subtitle-top">Espero que sí seamos novios</div>
    <h1 class="main-name">Wilber</h1>
    <div class="love-line">Mi Luz y Mi Universo</div>
  </div>

  <div class="hint">Mueve el cursor o toca la pantalla para crear constelaciones ✨</div>

  <script>
    const canvas = document.getElementById("universeCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    const pointer = { x: -9999, y: -9999, active: false };
    const burstParticles = [];
    const rainStars = [];
    const shootingStars = [];
    const floatingHearts = [];

    function spawnBurst(x, y, count = 26) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const speed = 1.2 + Math.random() * 4.2;
        burstParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.016 + Math.random() * 0.015,
          size: 4 + Math.random() * 7,
          isGold: Math.random() > 0.45
        });
      }
    }

    function spawnRainStar(customX = null, customY = null, fast = false) {
      const x = customX !== null ? customX : Math.random() * (width + 180) - 90;
      const y = customY !== null ? customY : -20 - Math.random() * 80;
      const driftX = (Math.random() - 0.35) * (fast ? 2.4 : 1.1);
      const fallY = (fast ? 4.2 : 1.7) + Math.random() * (fast ? 3.8 : 2.1);

      rainStars.push({
        x,
        y,
        vx: driftX,
        vy: fallY,
        tailLen: (fast ? 42 : 18) + Math.random() * (fast ? 36 : 20),
        size: 3.5 + Math.random() * 5.5,
        alpha: 0.55 + Math.random() * 0.45,
        isGold: Math.random() > 0.52,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }

    function spawnFloatingHeart(x = null, y = null) {
      floatingHearts.push({
        x: x !== null ? x : Math.random() * width,
        y: y !== null ? y : height + 25,
        vy: -(0.75 + Math.random() * 1.15),
        vx: (Math.random() - 0.5) * 0.5,
        size: 9 + Math.random() * 11,
        alpha: 0.55 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() > 0.35 ? 342 : 205
      });
    }

    function drawMiniHeart(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size / 16, size / 16);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 4.5);
      ctx.bezierCurveTo(-8, -4.5, -16, 2, 0, 14);
      ctx.bezierCurveTo(16, 2, 8, -4.5, 0, 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function triggerMeteorShower() {
      for (let i = 0; i < 48; i++) {
        setTimeout(() => {
          spawnRainStar(Math.random() * (width + 220) - 110, -25 - Math.random() * 60, true);
          if (i % 3 === 0) spawnShootingStar();
          if (i % 4 === 0) spawnFloatingHeart();
        }, i * 35);
      }
    }

    document.getElementById("meteorShowerBtn").addEventListener("click", triggerMeteorShower);

    window.addEventListener("mousemove", (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
      if (Math.random() < 0.35) {
        spawnBurst(pointer.x, pointer.y, 2);
      }
    });

    window.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        pointer.x = e.touches[0].clientX;
        pointer.y = e.touches[0].clientY;
        pointer.active = true;
        spawnBurst(pointer.x, pointer.y, 24);
        spawnFloatingHeart(pointer.x, pointer.y);
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        pointer.x = e.touches[0].clientX;
        pointer.y = e.touches[0].clientY;
        pointer.active = true;
        if (Math.random() < 0.45) {
          spawnBurst(pointer.x, pointer.y, 3);
        }
      }
    }, { passive: true });

    window.addEventListener("click", (e) => {
      if (e.target.closest(".controls-bar")) return;
      spawnBurst(e.clientX, e.clientY, 28);
      spawnFloatingHeart(e.clientX, e.clientY);
    });

    window.addEventListener("mouseleave", () => {
      pointer.active = false;
    });

    // Reproducción de música desde un video de la galería + melodía integrada de respaldo
    const galleryVideoInput = document.getElementById("galleryVideoInput");
    const galleryVideoSource = document.getElementById("galleryVideoSource");
    const musicBtn = document.getElementById("musicBtn");
    const mediaBadge = document.getElementById("mediaBadge");

    let audioCtx = null;
    let melodyTimer = null;
    let isMusicOn = false;
    let hasGalleryVideo = false;
    let currentVideoUrl = null;
    let stepIndex = 0;

    const progression = [
      [174.61, 220.00, 261.63, 329.63],
      [164.81, 196.00, 246.94, 392.00],
      [146.83, 174.61, 220.00, 349.23],
      [130.81, 196.00, 246.94, 329.63]
    ];

    const leadMelody = [
      659.25, 587.33, 523.25, 440.00,
      587.33, 523.25, 493.88, 392.00,
      523.25, 440.00, 392.00, 349.23,
      440.00, 392.00, 329.63, 261.63
    ];

    function stopFallbackMelody() {
      if (melodyTimer) {
        clearInterval(melodyTimer);
        melodyTimer = null;
      }
    }

    function playStep() {
      if (!audioCtx || !isMusicOn || hasGalleryVideo) return;
      const now = audioCtx.currentTime;
      const chordIdx = Math.floor(stepIndex / 4) % progression.length;
      const chord = progression[chordIdx];

      if (stepIndex % 4 === 0) {
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.018 - idx * 0.002, now + 0.35);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 2.35);
        });
      }

      const noteFreq = leadMelody[stepIndex % leadMelody.length];
      const noteOsc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      noteOsc.type = "sine";
      noteOsc.frequency.setValueAtTime(noteFreq, now);

      noteGain.gain.setValueAtTime(0.0001, now);
      noteGain.gain.exponentialRampToValueAtTime(0.032, now + 0.08);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

      noteOsc.connect(noteGain);
      noteGain.connect(audioCtx.destination);
      noteOsc.start(now);
      noteOsc.stop(now + 0.75);

      stepIndex++;
    }

    function startFallbackMelody() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      stopFallbackMelody();
      playStep();
      melodyTimer = setInterval(playStep, 520);
    }

    async function turnMusicOn() {
      isMusicOn = true;
      musicBtn.textContent = "♪ Música: ON";
      if (hasGalleryVideo) {
        stopFallbackMelody();
        galleryVideoSource.muted = false;
        try {
          await galleryVideoSource.play();
        } catch (e) {
          startFallbackMelody();
        }
      } else {
        startFallbackMelody();
      }
    }

    function turnMusicOff() {
      isMusicOn = false;
      musicBtn.textContent = "♪ Música: OFF";
      stopFallbackMelody();
      if (hasGalleryVideo) {
        galleryVideoSource.pause();
      }
    }

    musicBtn.addEventListener("click", () => {
      if (!isMusicOn) {
        turnMusicOn();
      } else {
        turnMusicOff();
      }
    });

    galleryVideoInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (currentVideoUrl) {
        URL.revokeObjectURL(currentVideoUrl);
      }
      currentVideoUrl = URL.createObjectURL(file);
      hasGalleryVideo = true;
      galleryVideoSource.src = currentVideoUrl;
      galleryVideoSource.muted = false;
      mediaBadge.textContent = `Video activo: ${file.name}`;

      stopFallbackMelody();
      isMusicOn = true;
      musicBtn.textContent = "♪ Música: ON";
      try {
        await galleryVideoSource.play();
      } catch (err) {
        mediaBadge.textContent = `Toca "Música: ON" para iniciar: ${file.name}`;
      }
    });

    function createGlowSprite(size, innerColor, midColor, outerColor) {
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const gCtx = c.getContext("2d");
      const half = size / 2;
      const grad = gCtx.createRadialGradient(half, half, 0, half, half, half);
      grad.addColorStop(0, innerColor);
      grad.addColorStop(0.28, midColor);
      grad.addColorStop(1, outerColor);
      gCtx.fillStyle = grad;
      gCtx.fillRect(0, 0, size, size);
      return c;
    }

    const starBlueSprite = createGlowSprite(64, "rgba(255,255,255,1)", "rgba(135,205,255,0.7)", "rgba(0,45,130,0)");
    const starGoldSprite = createGlowSprite(64, "rgba(255,252,242,1)", "rgba(255,210,135,0.68)", "rgba(130,65,0,0)");
    const heartRubySprite = createGlowSprite(64, "rgba(255,255,255,1)", "rgba(255,95,150,0.8)", "rgba(180,10,65,0)");
    const heartCyanSprite = createGlowSprite(64, "rgba(255,255,255,1)", "rgba(105,215,255,0.85)", "rgba(10,95,210,0)");

    let nebulaCanvas = document.createElement("canvas");
    function buildNebulaBackground() {
      nebulaCanvas.width = width;
      nebulaCanvas.height = height;
      const nCtx = nebulaCanvas.getContext("2d");

      const baseGrad = nCtx.createRadialGradient(width * 0.5, height * 0.45, 10, width * 0.5, height * 0.5, Math.max(width, height) * 0.88);
      baseGrad.addColorStop(0, "#0c1830");
      baseGrad.addColorStop(0.45, "#050a16");
      baseGrad.addColorStop(1, "#010206");
      nCtx.fillStyle = baseGrad;
      nCtx.fillRect(0, 0, width, height);

      const clouds = [
        { x: width * 0.22, y: height * 0.28, r: Math.max(width, height) * 0.45, c1: "rgba(38, 105, 210, 0.18)", c2: "rgba(10, 25, 65, 0)" },
        { x: width * 0.78, y: height * 0.32, r: Math.max(width, height) * 0.46, c1: "rgba(105, 48, 165, 0.16)", c2: "rgba(20, 10, 50, 0)" },
        { x: width * 0.5, y: height * 0.75, r: Math.max(width, height) * 0.5, c1: "rgba(50, 135, 235, 0.22)", c2: "rgba(5, 15, 40, 0)" },
        { x: width * 0.5, y: height * 0.32, r: Math.max(width, height) * 0.34, c1: "rgba(210, 60, 120, 0.14)", c2: "rgba(40, 5, 20, 0)" }
      ];

      nCtx.globalCompositeOperation = "screen";
      for (const cl of clouds) {
        const g = nCtx.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
        g.addColorStop(0, cl.c1);
        g.addColorStop(1, cl.c2);
        nCtx.fillStyle = g;
        nCtx.fillRect(0, 0, width, height);
      }
      nCtx.globalCompositeOperation = "source-over";
    }

    let stars = [];
    let heartParticles = [];
    let galaxyParticles = [];

    function heartEquation(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      return { x: x * scale, y: y * scale };
    }

    function initScene() {
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      buildNebulaBackground();

      const starCount = Math.min(780, Math.floor((width * height) / 1850));
      stars = Array.from({ length: starCount }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          z: depth,
          size: 1.6 + depth * 6.2,
          alpha: 0.35 + depth * 0.65,
          twinkleSpeed: 0.015 + Math.random() * 0.04,
          phase: Math.random() * Math.PI * 2,
          isGold: Math.random() > 0.68,
          hasCrossFlare: depth > 0.78 && Math.random() > 0.55
        };
      });

      const scale = Math.min(width, height) * 0.017;
      const cx = width * 0.5;
      const cy = height * 0.32;
      const heartCount = 1150;

      heartParticles = Array.from({ length: heartCount }, (_, i) => {
        const t = Math.random() * Math.PI * 2;
        const shell = Math.pow(Math.random(), 0.2);
        const pt = heartEquation(t, scale * shell);
        const zDepth = (Math.random() - 0.5) * 48;
        return {
          baseX: pt.x,
          baseY: pt.y,
          z: zDepth,
          x: cx + (Math.random() - 0.5) * width * 0.85,
          y: cy + (Math.random() - 0.5) * height * 0.85,
          vx: 0,
          vy: 0,
          size: 3.6 + Math.random() * 6.8,
          phase: Math.random() * Math.PI * 2,
          isCyan: i % 3 === 0
        };
      });

      const maxRadius = Math.min(width, height) * 0.36;
      const galaxyCount = 1550;
      galaxyParticles = Array.from({ length: galaxyCount }, (_, i) => {
        const arm = i % 4;
        const distNorm = Math.pow(Math.random(), 0.8);
        const radius = 12 + distNorm * maxRadius;
        const armAngle = (arm * Math.PI * 2) / 4;
        const spiralTwist = distNorm * 4.6;
        const scatter = (Math.random() - 0.5) * (0.32 + distNorm * 0.55);

        return {
          radius,
          distNorm,
          angle: armAngle + spiralTwist + scatter,
          angularSpeed: 0.0022 + (1 - distNorm) * 0.0058,
          verticalOffset: (Math.random() - 0.5) * (1 - distNorm) * 15,
          size: 2.5 + (1 - distNorm) * 5.8 + Math.random() * 2.5,
          isWarmCore: distNorm < 0.28 || Math.random() > 0.76
        };
      });
    }

    window.addEventListener("resize", initScene);
    initScene();

    function spawnShootingStar() {
      const startX = Math.random() * width * 0.88;
      const startY = Math.random() * height * 0.42;
      const angle = (20 + Math.random() * 20) * (Math.PI / 180);
      const speed = 11 + Math.random() * 7.5;
      shootingStars.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: 120 + Math.random() * 100,
        life: 1,
        decay: 0.015 + Math.random() * 0.01
      });
    }

    setInterval(() => spawnRainStar(), 240);
    for (let i = 0; i < 20; i++) {
      spawnRainStar(Math.random() * width, Math.random() * height * 0.85, false);
    }

    setInterval(spawnShootingStar, 1850);
    setTimeout(spawnShootingStar, 500);
    setTimeout(spawnShootingStar, 1200);

    setInterval(() => {
      if (floatingHearts.length < 28) spawnFloatingHeart();
    }, 950);
    for (let i = 0; i < 10; i++) {
      spawnFloatingHeart(Math.random() * width, Math.random() * height);
    }

    const phrases = [
      "Espero que sí seamos novios, Wilber",
      "Me encantas muchísimo, Wilber",
      "Contigo cada día tiene magia",
      "Mi lugar favorito en el universo",
      "Eres increíble, Wilber",
      "Gracias por existir y hacerme tan feliz",
      "Mi estrella más brillante en la noche",
      "Eres mi mejor casualidad y mi mejor ilusión",
      "Me gustaría caminar siempre de tu mano, Wilber",
      "Mi corazón se acelera contigo, Wilber",
      "Eres mi refugio, mi calma y mi sonrisa",
      "Ojalá pronto seamos novios, Wilber",
      "Si volviera a elegir, te elegiría mil veces, Wilber",
      "Iluminas hasta mis días más grises",
      "Eres el sueño que me gusta imaginar",
      "Cada instante contigo vale oro, Wilber",
      "Admiro tu corazón y todo lo que eres, Wilber",
      "Eres mi historia favorita empezando",
      "Contigo el tiempo se vuelve especial",
      "Mi pensamiento favorito de cada día, Wilber"
    ];
    const sparks = ["💙", "✨", "💫", "🌌", "🤍", "⭐", "🌸", "🌠", "💖"];

    const floatingElements = [];
    function createFloatingItem() {
      if (floatingElements.length > 12) return;

      const el = document.createElement("div");
      el.classList.add("floating-item");

      if (Math.random() < 0.78) {
        el.classList.add("floating-phrase");
        el.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      } else {
        el.classList.add("floating-spark");
        el.textContent = sparks[Math.floor(Math.random() * sparks.length)];
      }

      document.body.appendChild(el);

      const fromLeft = Math.random() > 0.5;
      const laneY = Math.random() > 0.5
        ? height * (0.07 + Math.random() * 0.14)
        : height * (0.51 + Math.random() * 0.40);

      floatingElements.push({
        el,
        x: fromLeft ? -300 : width + 300,
        y: laneY,
        vx: fromLeft ? (0.68 + Math.random() * 0.75) : -(0.68 + Math.random() * 0.75),
        vy: (Math.random() - 0.5) * 0.18,
        wavePhase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 8; i++) {
      setTimeout(createFloatingItem, i * 850);
    }
    setInterval(createFloatingItem, 2100);

    let time = 0;
    function render() {
      time += 0.016;

      ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(nebulaCanvas, 0, 0);

      ctx.globalCompositeOperation = "lighter";

      const parallaxX = pointer.active ? (pointer.x - width * 0.5) * 0.032 : Math.sin(time * 0.3) * 8;
      const parallaxY = pointer.active ? (pointer.y - height * 0.5) * 0.032 : Math.cos(time * 0.25) * 6;

      for (const s of stars) {
        const twinkle = 0.65 + 0.35 * Math.sin(time * 3.2 * s.twinkleSpeed * 38 + s.phase);
        const alpha = s.alpha * twinkle;
        ctx.globalAlpha = alpha;
        const sx = (s.x + parallaxX * s.z + width) % width;
        const sy = (s.y + parallaxY * s.z + height) % height;
        const sprite = s.isGold ? starGoldSprite : starBlueSprite;
        ctx.drawImage(sprite, sx - s.size * 0.5, sy - s.size * 0.5, s.size, s.size);

        if (s.hasCrossFlare && twinkle > 0.82) {
          const flareLen = s.size * 1.9 * twinkle;
          ctx.strokeStyle = s.isGold ? "rgba(255, 235, 190, 0.45)" : "rgba(190, 230, 255, 0.45)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(sx - flareLen, sy);
          ctx.lineTo(sx + flareLen, sy);
          ctx.moveTo(sx, sy - flareLen);
          ctx.lineTo(sx, sy + flareLen);
          ctx.stroke();
        }
      }

      for (let i = rainStars.length - 1; i >= 0; i--) {
        const rs = rainStars[i];
        rs.x += rs.vx;
        rs.y += rs.vy;

        if (rs.y > height + 40 || rs.x < -120 || rs.x > width + 120) {
          rainStars.splice(i, 1);
          continue;
        }

        const speedNorm = Math.hypot(rs.vx, rs.vy) || 1;
        const tailX = rs.x - (rs.vx / speedNorm) * rs.tailLen;
        const tailY = rs.y - (rs.vy / speedNorm) * rs.tailLen;
        const pulse = 0.72 + 0.28 * Math.sin(time * 5 + rs.twinklePhase);

        ctx.globalAlpha = rs.alpha * pulse;
        const trailGrad = ctx.createLinearGradient(rs.x, rs.y, tailX, tailY);
        if (rs.isGold) {
          trailGrad.addColorStop(0, "rgba(255, 248, 225, 0.95)");
          trailGrad.addColorStop(1, "rgba(255, 195, 110, 0)");
        } else {
          trailGrad.addColorStop(0, "rgba(220, 242, 255, 0.95)");
          trailGrad.addColorStop(1, "rgba(110, 185, 255, 0)");
        }

        ctx.strokeStyle = trailGrad;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(rs.x, rs.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        const sprite = rs.isGold ? starGoldSprite : starBlueSprite;
        ctx.drawImage(sprite, rs.x - rs.size * 0.5, rs.y - rs.size * 0.5, rs.size, rs.size);
      }

      for (let i = floatingHearts.length - 1; i >= 0; i--) {
        const fh = floatingHearts[i];
        fh.y += fh.vy;
        fh.x += fh.vx + Math.sin(time * 2 + fh.phase) * 0.45;
        if (fh.y < -30) {
          floatingHearts.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = fh.alpha;
        drawMiniHeart(fh.x, fh.y, fh.size, `hsla(${fh.hue}, 90%, 72%, 0.9)`);
      }

      const gx = width * 0.5 + parallaxX * 0.7;
      const gy = height * 0.75 + parallaxY * 0.5;

      ctx.globalAlpha = 0.96;
      const coreRadius = Math.min(width, height) * 0.17;
      const coreGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, coreRadius);
      coreGrad.addColorStop(0, "rgba(255, 252, 246, 0.96)");
      coreGrad.addColorStop(0.22, "rgba(185, 220, 255, 0.58)");
      coreGrad.addColorStop(0.55, "rgba(80, 140, 250, 0.19)");
      coreGrad.addColorStop(1, "rgba(0, 10, 40, 0)");
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.ellipse(gx, gy, coreRadius * 1.45, coreRadius * 0.54, 0, 0, Math.PI * 2);
      ctx.fill();

      for (const gp of galaxyParticles) {
        gp.angle += gp.angularSpeed;
        const rawX = Math.cos(gp.angle) * gp.radius;
        const rawY = Math.sin(gp.angle) * gp.radius * 0.34 + gp.verticalOffset;
        const depthFactor = (Math.sin(gp.angle) + 1) * 0.5;
        const px = gx + rawX;
        const py = gy + rawY;
        const drawSize = gp.size * (0.75 + depthFactor * 0.45);

        ctx.globalAlpha = (0.36 + depthFactor * 0.56) * (1 - gp.distNorm * 0.32);
        const sprite = gp.isWarmCore ? starGoldSprite : starBlueSprite;
        ctx.drawImage(sprite, px - drawSize * 0.5, py - drawSize * 0.5, drawSize, drawSize);
      }

      const cx = width * 0.5 + parallaxX * 1.1;
      const cy = height * 0.32 + parallaxY * 0.9;

      const beatCycle = (time * 2.55) % (Math.PI * 2);
      const beatScale = 1 + Math.pow(Math.max(0, Math.sin(beatCycle)), 6) * 0.055;
      const rotY = Math.sin(time * 0.65) * 0.18;

      for (const p of heartParticles) {
        const rx = p.baseX * Math.cos(rotY) - p.z * Math.sin(rotY);
        const rz = p.baseX * Math.sin(rotY) + p.z * Math.cos(rotY);

        const targetX = cx + rx * beatScale;
        const targetY = cy + p.baseY * beatScale;

        if (pointer.active) {
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 115 && dist > 0.1) {
            const force = (115 - dist) / 115;
            p.vx += (dx / dist) * force * 2.4;
            p.vy += (dy / dist) * force * 2.4;
          }
        }

        p.vx += (targetX - p.x) * 0.065;
        p.vy += (targetY - p.y) * 0.065;
        p.vx *= 0.82;
        p.vy *= 0.82;
        p.x += p.vx;
        p.y += p.vy;

        const perspective = 1 + rz / 220;
        const size = p.size * perspective * beatScale;
        const shimmer = 0.62 + 0.38 * Math.sin(time * 3.5 + p.phase);

        ctx.globalAlpha = Math.min(1, shimmer * 0.92);
        const sprite = p.isCyan ? heartCyanSprite : heartRubySprite;
        ctx.drawImage(sprite, p.x - size * 0.5, p.y - size * 0.5, size, size);
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        st.x += st.vx;
        st.y += st.vy;
        st.life -= st.decay;

        if (st.life <= 0) {
          shootingStars.splice(i, 1);
          continue;
        }

        const tailX = st.x - (st.vx / 14) * st.length;
        const tailY = st.y - (st.vy / 14) * st.length;

        ctx.globalAlpha = st.life;
        const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, "rgba(255, 255, 255, 1)");
        grad.addColorStop(0.25, "rgba(155, 215, 255, 0.85)");
        grad.addColorStop(1, "rgba(50, 125, 255, 0)");

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        ctx.drawImage(starBlueSprite, st.x - 11, st.y - 11, 22, 22);
      }

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.95;
        b.vy *= 0.95;
        b.life -= b.decay;

        if (b.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = b.life;
        const sprite = b.isGold ? starGoldSprite : starBlueSprite;
        ctx.drawImage(sprite, b.x - b.size * 0.5, b.y - b.size * 0.5, b.size, b.size);
      }

      ctx.globalAlpha = 1;

      for (let i = floatingElements.length - 1; i >= 0; i--) {
        const item = floatingElements[i];
        item.x += item.vx;
        item.y += item.vy + Math.sin(time * 1.6 + item.wavePhase) * 0.18;

        const edgeDist = Math.min(item.x + 180, width - item.x + 180);
        const opacity = Math.max(0, Math.min(1, edgeDist / 220));
        item.el.style.opacity = opacity.toFixed(2);
        item.el.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;

        if (item.x < -380 || item.x > width + 380) {
          item.el.remove();
          floatingElements.splice(i, 1);
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
